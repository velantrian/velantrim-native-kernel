name: P5 patch C3 report profile id

on:
  push:
    branches: [agent/p5-sqlite-c3]
    paths:
      - ".github/workflows/p5-patch-report-profile-id.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p5-sqlite-c3
          fetch-depth: 0
      - name: Add generic evidence profile id
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("native_kernel/sqlite_profile/equivalence.py")
          text = path.read_text(encoding="utf-8")
          old = '''    return {\n        "report_version": REPORT_VERSION,\n        "comparison_id": "postgresql-reference__sqlite-embedded",'''
          new = '''    return {\n        "report_version": REPORT_VERSION,\n        "profile_id": "native-kernel/equivalence/postgresql-sqlite",\n        "comparison_id": "postgresql-reference__sqlite-embedded",'''
          if old not in text:
              raise SystemExit("expected C3 report block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native_kernel/sqlite_profile/equivalence.py
          git commit -m "fix: identify C3 evidence comparison profile"
          git push origin HEAD:agent/p5-sqlite-c3
