name: One-shot post-D8 truth patch
on:
  push:
    branches: [agent/post-d8-operator-decision-truth]
permissions:
  contents: write
jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'chore(state): apply post-D8 operator truth' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/post-d8-operator-decision-truth
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/ai_context/_apply_post_d8_state.py
      - run: python tools/ai_context/_apply_post_d8_surfaces.py
      - name: Commit patched truth surfaces
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project-state.json README.md README.ru.md STATUS.md ROADMAP.md docs/ai/README.md docs/ai/CURRENT_STATE.md docs/ai/KNOWN_RISKS.md docs/ai/NOTION_HANDOFF.md docs/adr/README.md
          git commit -m 'chore(state): reconcile human and machine truth after ADR-0027'
          git push origin HEAD:agent/post-d8-operator-decision-truth
