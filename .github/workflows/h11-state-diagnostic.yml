name: H11 state diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/h11-state-diagnostic.yml"
      - "AGENTS.md"
      - "project-state.json"
      - "docs/ai/POST_RESIDUAL_A10_STATE.md"
      - "tools/ai_context/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Architecture freeze repository baseline
        run: python -m unittest test_architecture_freeze.ArchitectureFreezeTests.test_repository_freeze_passes -v
        working-directory: tests
      - name: Issue 88 mutation traceback
        shell: bash
        working-directory: tests
        run: |
          set +e
          python -m unittest test_architecture_freeze.ArchitectureFreezeTests.test_issue_88_remains_open_verified_and_records_current_gate -v 2>&1 | tee issue88.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          text = Path("issue88.log").read_text(encoding="utf-8")
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Issue 88 architecture mutation::{text}")
          PY
            exit "$status"
          fi
