name: H11 state diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/h11-state-diagnostic.yml"
      - "AGENTS.md"
      - "project-state.json"
      - "docs/ai/POST_RESIDUAL_A10_STATE.md"
      - "tools/ai_context/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Architecture freeze validator tests
        run: python -m unittest discover -s tests -p 'test_architecture_freeze.py' -v
      - name: Bilingual parity validator tests
        run: python -m unittest discover -s tests -p 'test_bilingual_parity_validator.py' -v
      - name: Project state validator tests
        run: python -m unittest discover -s tests -p 'test_project_state.py' -v
      - name: Reconciliation validator tests
        run: python -m unittest discover -s tests -p 'test_reconciliation_state.py' -v
      - name: Evidence bundle tests
        run: python -m unittest discover -s tests -p 'test_evidence_bundle.py' -v
      - name: C5 manifest tests
        run: python -m unittest discover -s tests -p 'test_c5_manifest.py' -v
