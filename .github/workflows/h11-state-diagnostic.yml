name: H11 state diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/h11-state-diagnostic.yml"
      - "AGENTS.md"
      - "project-state.json"
      - "docs/ai/POST_RESIDUAL_A10_STATE.md"
      - "tools/ai_context/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: IAR-1 independence evidence
        run: python -m unittest discover -s tests -p 'test_iar1_independence_evidence.py' -v
      - name: BPV1 preregistration
        run: python -m unittest discover -s tests -p 'test_bpv1_preregistration.py' -v
      - name: BPV1 execution admission
        run: python -m unittest discover -s tests -p 'test_bpv1_execution_admission.py' -v
      - name: BPV1 D6 A10 classification
        run: python -m unittest discover -s tests -p 'test_bpv1_d6_a10_classification.py' -v
      - name: Residual A10 plan
        run: python -m unittest discover -s tests -p 'test_residual_a10_plan.py' -v
      - name: H11 family selection
        run: python -m unittest discover -s tests -p 'test_h11_family_selection.py' -v
      - name: H11 preregistration
        run: python -m unittest discover -s tests -p 'test_h11_preregistration.py' -v
      - name: H11 execution admission
        run: python -m unittest discover -s tests -p 'test_h11_execution_admission.py' -v
      - name: AI context validator
        run: python -m unittest discover -s tests -p 'test_ai_context_validator.py' -v
      - name: Architecture freeze repository baseline
        run: python -m unittest test_architecture_freeze.ArchitectureFreezeTests.test_repository_freeze_passes -v
        working-directory: tests
      - name: Architecture freeze validator tests
        run: python -m unittest discover -s tests -p 'test_architecture_freeze.py' -v
      - name: Bilingual parity validator tests
        run: python -m unittest discover -s tests -p 'test_bilingual_parity_validator.py' -v
      - name: Project state validator tests
        run: python -m unittest discover -s tests -p 'test_project_state.py' -v
      - name: Reconciliation validator tests
        run: python -m unittest discover -s tests -p 'test_reconciliation_state.py' -v
      - name: Evidence bundle tests
        run: python -m unittest discover -s tests -p 'test_evidence_bundle.py' -v
      - name: C5 manifest tests
        run: python -m unittest discover -s tests -p 'test_c5_manifest.py' -v
