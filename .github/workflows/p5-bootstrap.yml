name: P5 source bootstrap

on:
  push:
    branches: [agent/p5-sqlite-c3]
    paths:
      - ".github/workflows/p5-bootstrap.yml"
      - "tools/bootstrap/p5-source.part*"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p5-sqlite-c3
          fetch-depth: 0
      - name: Verify and unpack bounded P5 source
        run: |
          cat \
            tools/bootstrap/p5-source.part00 \
            tools/bootstrap/p5-source.part01 \
            tools/bootstrap/p5-source.part02 \
            tools/bootstrap/p5-source.part03 \
            | base64 -d > /tmp/p5-source.tar.gz
          echo "44225e1ccd99ed33fd62302421142ba61cefb83215f2a3f3832ea6d772ebce80  /tmp/p5-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/p5-source.tar.gz -C .
          rm -f tools/bootstrap/p5-source.part* .github/workflows/p5-bootstrap.yml
      - name: Commit generated P5 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add P5 SQLite and C3 executable slice"
          git push origin HEAD:agent/p5-sqlite-c3
