name: C5 docs bootstrap publisher

on:
  push:
    branches: [agent/c5-operational-rehearsal]
    paths:
      - ".c5-docs-bootstrap/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c5-operational-rehearsal
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify and unpack C5 documentation payload
        shell: bash
        run: |
          set -euo pipefail
          echo "51d0c43f8959d3a532bb55ad1ece4cb2470f7f9eab5e2b2510287fd35095d667  .c5-docs-bootstrap/part-00" | sha256sum -c -
          echo "4abdd751266b144ccea2fe763910e23f1acc18d5e1e733dfedd3c2408b8ec8c7  .c5-docs-bootstrap/part-01" | sha256sum -c -
          echo "f1b664069ebd7457574b7c037e9fb203af7574ce7404277b2ca80cba9bc178b5  .c5-docs-bootstrap/part-02" | sha256sum -c -
          echo "b6c7f8dd2e3569225b0f9f3b996875b919fb5f54645781ba4c1350c15eb9dde6  .c5-docs-bootstrap/part-03" | sha256sum -c -
          echo "a117616b9f513bc4394c3d5a03b8babfd07593189a75b3ca2b3bb91d27297edd  .c5-docs-bootstrap/part-04" | sha256sum -c -
          cat .c5-docs-bootstrap/part-* > /tmp/c5docs.b64
          test "$(wc -c < /tmp/c5docs.b64)" = "17196"
          base64 -d /tmp/c5docs.b64 > /tmp/c5docs.tar.gz
          echo "056eb51ae1a825c462b691919e9878742d3eb6c4c637c8244afca3030f981d59  /tmp/c5docs.tar.gz" | sha256sum -c -
          tar -tzf /tmp/c5docs.tar.gz
          tar -xzf /tmp/c5docs.tar.gz
      - name: Validate C5 documentation and continuity
        run: |
          python -m unittest discover -s tests -p 'test_ai_context_validator.py' -v
          python tools/ai_context/validate_context.py --repo .
          python -m unittest discover -s tests -p 'test_c5_operational_validation.py' -v
          python -m unittest discover -s tests -p 'test_c5_report_validator.py' -v
          python -m unittest discover -s tests -p 'test_c5_manifest.py' -v
          python tools/profiles/validate_c5_manifest.py
          python -m compileall -q native_kernel tools/ai_context tools/operations tools/profiles
      - name: Commit verified C5 documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            STATUS.md \
            AGENTS.md \
            README.md \
            README.ru.md \
            docs/CONFORMANCE_MODEL.md \
            docs/ai/README.md \
            docs/ai/CURRENT_STATE.md \
            docs/ai/C5_IMPLEMENTATION_RECORD.md \
            docs/ai/KNOWN_RISKS.md \
            docs/ai/WORK_LOG.md \
            docs/ai/COMPONENT_MAP.md \
            native_kernel/__init__.py \
            tools/ai_context/validate_context.py \
            tests/test_ai_context_validator.py
          if git diff --cached --quiet; then
            echo "No C5 documentation changes to commit"
            exit 0
          fi
          git commit -m "docs: publish C5 bounded rehearsal evidence"
          git push origin HEAD:agent/c5-operational-rehearsal
