name: P4 assertion conformance

on:
  pull_request:
    paths:
      - ".github/workflows/p4-conformance.yml"
      - "contracts/**"
      - "native_kernel/**"
      - "profiles/postgresql-reference-v0/**"
      - "tests/test_p4_*.py"
      - "tests/test_semantic_core.py"
      - "tests/test_postgresql_profile_*.py"
      - "tests/test_p3_*.py"
      - "tools/conformance/**"
      - "tools/profiles/validate_p4_manifest.py"
      - "docs/**"
      - "README.md"
      - "README.ru.md"
      - "STATUS.md"
      - "AGENTS.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/p4-conformance.yml"
      - "contracts/**"
      - "native_kernel/**"
      - "profiles/postgresql-reference-v0/**"
      - "tests/test_p4_*.py"
      - "tools/conformance/**"
      - "tools/profiles/validate_p4_manifest.py"
      - "docs/**"
      - "README.md"
      - "README.ru.md"
      - "STATUS.md"
      - "AGENTS.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p4-postgresql:
    name: p4-conformance (py${{ matrix.python }}, pg${{ matrix.postgresql }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        postgresql: ["16", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgresql }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: native_kernel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d native_kernel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NK_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/native_kernel_test
      NK_CONFORMANCE_LEVEL: C2
      NK_EVIDENCE_LEVEL: REPOSITORY_REPRODUCED
      NK_EVIDENCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      NK_EVIDENCE_RUN_ID: ${{ github.run_id }}
      NK_PYTHON_VERSION: ${{ matrix.python }}
      NK_POSTGRESQL_VERSION: ${{ matrix.postgresql }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install PostgreSQL integration driver
        run: python -m pip install --upgrade pip -r profiles/postgresql-reference-v0/requirements-p2-ci.txt
      - name: P4 unit and traceability tests
        run: python -m unittest discover -s tests -p 'test_p4_conformance_unit.py' -v
      - name: P4 manifest guards
        run: |
          python -m unittest discover -s tests -p 'test_p4_manifest.py' -v
          python tools/profiles/validate_p4_manifest.py
      - name: P4 PostgreSQL C1 integration test
        run: python -m unittest discover -s tests -p 'test_p4_postgresql_integration.py' -v
      - name: Generate exact C2 evidence report
        run: |
          mkdir -p artifacts
          python tools/conformance/runner.py adapter \
            --output artifacts/p4-evidence-report.json \
            -- python tools/conformance/postgresql_profile_adapter.py
          python tools/conformance/validate_p4_report.py \
            --require-c2 artifacts/p4-evidence-report.json
      - name: P1 regression
        run: |
          python -m unittest discover -s tests -p 'test_semantic_core.py' -v
          python -m unittest discover -s tests -p 'test_p1_manifest.py' -v
          python tools/profiles/validate_p1_manifest.py
      - name: P2 regression
        run: |
          python -m unittest discover -s tests -p 'test_postgresql_profile_unit.py' -v
          python -m unittest discover -s tests -p 'test_postgresql_profile_integration.py' -v
          python -m unittest discover -s tests -p 'test_p2_manifest.py' -v
          python tools/profiles/validate_p2_manifest.py
      - name: P3 regression
        run: |
          python -m unittest discover -s tests -p 'test_p3_semantic.py' -v
          python -m unittest discover -s tests -p 'test_p3_postgresql_integration.py' -v
          python -m unittest discover -s tests -p 'test_p3_manifest.py' -v
          python tools/profiles/validate_p3_manifest.py
      - name: Compile implementation and tooling
        run: python -m compileall -q native_kernel tools/conformance tools/profiles
      - name: Upload assertion-scoped evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: p4-evidence-py${{ matrix.python }}-pg${{ matrix.postgresql }}
          path: artifacts/p4-evidence-report.json
          if-no-files-found: error
          retention-days: 30
