name: P3 replay and projection integrity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native_kernel/postgresql_profile/**'
      - 'native_kernel/semantic_core/**'
      - 'profiles/postgresql-reference-v0/p3-manifest.json'
      - 'profiles/postgresql-reference-v0/requirements-p2-ci.txt'
      - 'tools/profiles/validate_p3_manifest.py'
      - 'tests/test_p3_*.py'
      - '.github/workflows/p3-replay-projections.yml'
  push:
    branches: [main]
    paths:
      - 'native_kernel/postgresql_profile/**'
      - 'native_kernel/semantic_core/**'
      - 'profiles/postgresql-reference-v0/p3-manifest.json'
      - 'profiles/postgresql-reference-v0/requirements-p2-ci.txt'
      - 'tools/profiles/validate_p3_manifest.py'
      - 'tests/test_p3_*.py'
      - '.github/workflows/p3-replay-projections.yml'

permissions:
  contents: read

jobs:
  p3-postgresql:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
        postgres: ['16', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: native_kernel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d native_kernel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NK_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/native_kernel_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install PostgreSQL integration driver
        run: python -m pip install "psycopg[binary]==3.3.2"
      - name: P3 semantic unit tests
        run: python -m unittest discover -s tests -p 'test_p3_semantic.py' -v
      - name: P3 manifest guards
        run: |
          python -m unittest discover -s tests -p 'test_p3_manifest.py' -v
          python tools/profiles/validate_p3_manifest.py
      - name: P3 PostgreSQL integration tests
        run: python -m unittest discover -s tests -p 'test_p3_*integration.py' -v
      - name: P2 regression tests
        run: |
          python -m unittest discover -s tests -p 'test_postgresql_profile_unit.py' -v
          python -m unittest discover -s tests -p 'test_postgresql_profile_integration.py' -v
      - name: Compile packages
        run: python -m compileall -q native_kernel tools/profiles
