name: H11 frozen plan digest

on:
  pull_request:
    paths:
      - ".github/workflows/h11-digest.yml"
      - "docs/research/H11_PREREGISTRATION.json"
      - "tools/bpv1/plan_digest.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Compute exact H11 preregistration SHA-256
        run: |
          DIGEST="$(python tools/bpv1/plan_digest.py --repo . --plan docs/research/H11_PREREGISTRATION.json)"
          printf '%s\n' "$DIGEST" | tee h11-plan-sha256.txt
          echo "::notice title=H11 frozen plan SHA-256::$DIGEST"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: h11-plan-sha256
          path: h11-plan-sha256.txt
          if-no-files-found: error
