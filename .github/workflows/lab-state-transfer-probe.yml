name: Lab state transfer probe

on:
  pull_request:
    paths:
      - 'tools/lab/state_transfer_probe.py'
      - 'tests/test_lab_state_transfer_probe.py'
      - 'native_kernel/semantic_core/**'
      - '.github/workflows/lab-state-transfer-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run synthetic read-only export comparisons
        run: python -m unittest discover -s tests -p test_lab_state_transfer_probe.py -v
