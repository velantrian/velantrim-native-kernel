name: P5 SQLite and C3 equivalence

on:
  pull_request:
    paths:
      - ".github/workflows/p5-sqlite-c3.yml"
      - "contracts/**"
      - "native_kernel/**"
      - "profiles/sqlite-embedded-v0/**"
      - "profiles/postgresql-reference-v0/**"
      - "tests/test_p5_*.py"
      - "tests/test_sqlite_profile_unit.py"
      - "tests/test_p4_*.py"
      - "tools/conformance/**"
      - "tools/profiles/validate_p5_manifest.py"
      - "docs/**"
      - "README.md"
      - "README.ru.md"
      - "STATUS.md"
      - "AGENTS.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/p5-sqlite-c3.yml"
      - "contracts/**"
      - "native_kernel/**"
      - "profiles/sqlite-embedded-v0/**"
      - "profiles/postgresql-reference-v0/**"
      - "tests/test_p5_*.py"
      - "tests/test_sqlite_profile_unit.py"
      - "tests/test_p4_*.py"
      - "tools/conformance/**"
      - "tools/profiles/validate_p5_manifest.py"
      - "docs/**"
      - "README.md"
      - "README.ru.md"
      - "STATUS.md"
      - "AGENTS.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p5-c3:
    name: p5-c3 (py${{ matrix.python }}, pg${{ matrix.postgresql }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        postgresql: ["16", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgresql }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: native_kernel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d native_kernel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NK_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/native_kernel_test
      NK_TEST_SQLITE_PATH: artifacts/p5-c3.db
      NK_CONFORMANCE_LEVEL: C2
      NK_EVIDENCE_LEVEL: REPOSITORY_REPRODUCED
      NK_EVIDENCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      NK_EVIDENCE_RUN_ID: ${{ github.run_id }}
      NK_PYTHON_VERSION: ${{ matrix.python }}
      NK_POSTGRESQL_VERSION: ${{ matrix.postgresql }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install PostgreSQL integration driver
        run: python -m pip install --upgrade pip -r profiles/postgresql-reference-v0/requirements-p2-ci.txt
      - name: Record SQLite version
        run: echo "NK_SQLITE_VERSION=$(python -c 'import sqlite3; print(sqlite3.sqlite_version)')" >> "$GITHUB_ENV"
      - name: P5 SQLite unit and report tests
        run: |
          python -m unittest discover -s tests -p 'test_sqlite_profile_unit.py' -v
          python -m unittest discover -s tests -p 'test_p5_sqlite_integration.py' -v
          python -m unittest discover -s tests -p 'test_p5_report_validator.py' -v
      - name: P5 manifest guards
        run: |
          python -m unittest discover -s tests -p 'test_p5_manifest.py' -v
          python tools/profiles/validate_p5_manifest.py
      - name: P5 PostgreSQL SQLite C3 integration
        run: python -m unittest discover -s tests -p 'test_p5_cross_profile_integration.py' -v
      - name: Generate exact repository reports
        run: |
          mkdir -p artifacts
          rm -f "$NK_TEST_SQLITE_PATH" artifacts/p5-c3-behaviour.db artifacts/p5-c3-import.db
          python tools/conformance/runner.py adapter \
            --output artifacts/postgresql-p4-report.json \
            -- python tools/conformance/postgresql_profile_adapter.py
          rm -f "$NK_TEST_SQLITE_PATH"
          python tools/conformance/runner.py adapter \
            --output artifacts/sqlite-p5-report.json \
            -- python tools/conformance/sqlite_profile_adapter.py
          python tools/conformance/validate_p5_report.py sqlite \
            artifacts/sqlite-p5-report.json --require-repository
          rm -f "$NK_TEST_SQLITE_PATH" artifacts/p5-c3-behaviour.db artifacts/p5-c3-import.db
          python tools/conformance/cross_profile_comparator.py \
            contracts/fixture-pack.json \
            > artifacts/c3-equivalence-report.json
          python tools/conformance/validate_p5_report.py c3 \
            artifacts/c3-equivalence-report.json --require-repository
      - name: P1-P4 regressions
        run: |
          python -m unittest discover -s tests -p 'test_semantic_core.py' -v
          python -m unittest discover -s tests -p 'test_postgresql_profile_unit.py' -v
          python -m unittest discover -s tests -p 'test_p3_semantic.py' -v
          python -m unittest discover -s tests -p 'test_p4_conformance_unit.py' -v
          python -m unittest discover -s tests -p 'test_p4_manifest.py' -v
          python tools/profiles/validate_p4_manifest.py
      - name: Compile implementation and tooling
        run: python -m compileall -q native_kernel tools/conformance tools/profiles
      - name: Upload P5 and C3 evidence
        uses: actions/upload-artifact@v4
        with:
          name: p5-c3-evidence-py${{ matrix.python }}-pg${{ matrix.postgresql }}
          path: |
            artifacts/postgresql-p4-report.json
            artifacts/sqlite-p5-report.json
            artifacts/c3-equivalence-report.json
          if-no-files-found: error
          retention-days: 30
