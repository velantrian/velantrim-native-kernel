name: Conformance fixture integrity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'contracts/**'
      - 'profiles/**'
      - 'docs/contracts/**'
      - 'docs/CONFORMANCE_MODEL.md'
      - 'docs/rfc/0002-*.md'
      - 'docs/adr/0011-*.md'
      - 'docs/adr/0012-*.md'
      - 'docs/adr/0013-*.md'
      - 'docs/adr/0014-*.md'
      - 'tools/conformance/**'
      - 'tools/profiles/**'
      - 'tests/test_conformance_runner.py'
      - 'tests/test_profile_manifest.py'
      - '.github/workflows/conformance-fixtures.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'profiles/**'
      - 'docs/contracts/**'
      - 'docs/CONFORMANCE_MODEL.md'
      - 'docs/rfc/0002-*.md'
      - 'docs/adr/0011-*.md'
      - 'docs/adr/0012-*.md'
      - 'docs/adr/0013-*.md'
      - 'docs/adr/0014-*.md'
      - 'tools/conformance/**'
      - 'tools/profiles/**'
      - 'tests/test_conformance_runner.py'
      - 'tests/test_profile_manifest.py'
      - '.github/workflows/conformance-fixtures.yml'

permissions:
  contents: read

jobs:
  fixture-integrity:
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -p 'test_conformance_runner.py'
      - run: python -m unittest discover -s tests -p 'test_profile_manifest.py'
      - run: python tools/conformance/runner.py validate --output conformance-evidence.json
      - run: python tools/profiles/validate_manifest.py --output profile-manifest-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-evidence-python-${{ matrix.python-version }}
          path: |
            conformance-evidence.json
            profile-manifest-evidence.json
