name: AI context integrity

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "README.md"
      - "README.ru.md"
      - "STATUS.md"
      - "ROADMAP.md"
      - "project-state.json"
      - ".github/copilot-instructions.md"
      - ".github/pull_request_template.md"
      - ".github/workflows/ai-context.yml"
      - "contracts/project-state-v1.schema.json"
      - "contracts/project-state-v2.schema.json"
      - "contracts/registry.json"
      - "contracts/evidence-bundle-v1.schema.json"
      - "docs/**"
      - "evidence/**"
      - "profiles/operational-validation-v0/c5-manifest.json"
      - "tools/ai_context/**"
      - "tools/docs/**"
      - "tools/evidence/**"
      - "tools/profiles/validate_c5_manifest.py"
      - "tests/test_ai_context_validator.py"
      - "tests/test_bilingual_parity_validator.py"
      - "tests/test_project_state.py"
      - "tests/test_reconciliation_state.py"
      - "tests/test_evidence_bundle.py"
      - "tests/test_c5_manifest.py"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "README.md"
      - "README.ru.md"
      - "STATUS.md"
      - "ROADMAP.md"
      - "project-state.json"
      - ".github/copilot-instructions.md"
      - ".github/pull_request_template.md"
      - ".github/workflows/ai-context.yml"
      - "contracts/project-state-v1.schema.json"
      - "contracts/project-state-v2.schema.json"
      - "contracts/registry.json"
      - "contracts/evidence-bundle-v1.schema.json"
      - "docs/**"
      - "evidence/**"
      - "profiles/operational-validation-v0/c5-manifest.json"
      - "tools/ai_context/**"
      - "tools/docs/**"
      - "tools/evidence/**"
      - "tools/profiles/validate_c5_manifest.py"
      - "tests/test_ai_context_validator.py"
      - "tests/test_bilingual_parity_validator.py"
      - "tests/test_project_state.py"
      - "tests/test_reconciliation_state.py"
      - "tests/test_evidence_bundle.py"
      - "tests/test_c5_manifest.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out exact commit with complete history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile continuity, evidence and documentation tooling
        run: |
          python -m compileall -q \
            tools/ai_context \
            tools/docs \
            tools/evidence \
            tools/profiles/validate_c5_manifest.py \
            tests/test_ai_context_validator.py \
            tests/test_bilingual_parity_validator.py \
            tests/test_project_state.py \
            tests/test_reconciliation_state.py \
            tests/test_evidence_bundle.py \
            tests/test_c5_manifest.py

      - name: Test AI context validator
        run: python -m unittest discover -s tests -p 'test_ai_context_validator.py' -v

      - name: Test bilingual parity validator
        run: python -m unittest discover -s tests -p 'test_bilingual_parity_validator.py' -v

      - name: Test project state
        run: python -m unittest discover -s tests -p 'test_project_state.py' -v

      - name: Reconciliation repository pass
        run: python -m unittest discover -s tests -p 'test_reconciliation_state.py' -k repository_reconciliation_passes -v

      - name: Reconciliation issue snapshots
        run: python -m unittest discover -s tests -p 'test_reconciliation_state.py' -k foundational_issues_are_present_and_open -v

      - name: Reconciliation checkpoint roles
        run: python -m unittest discover -s tests -p 'test_reconciliation_state.py' -k checkpoint_roles_separate_publication_and_notion -v

      - name: Reconciliation closed issue rejection
        run: python -m unittest discover -s tests -p 'test_reconciliation_state.py' -k closed_foundational_issue_is_rejected -v

      - name: Reconciliation checkpoint drift rejection
        run: python -m unittest discover -s tests -p 'test_reconciliation_state.py' -k notion_checkpoint_drift_is_rejected -v

      - name: Reconciliation role collapse rejection
        run: python -m unittest discover -s tests -p 'test_reconciliation_state.py' -k publication_and_notion_role_collapse_is_rejected -v

      - name: Reconciliation current surface rejection
        run: python -m unittest discover -s tests -p 'test_reconciliation_state.py' -k current_surface_missing_descendant_checkpoint_is_rejected -v

      - name: Reconciliation missing comment rejection
        run: python -m unittest discover -s tests -p 'test_reconciliation_state.py' -k missing_comment_identity_is_rejected -v

      - name: Reconciliation identities recorded
        run: python -m unittest discover -s tests -p 'test_reconciliation_state.py' -k all_comment_and_page_identities_are_recorded -v

      - name: Test evidence bundle
        run: python -m unittest discover -s tests -p 'test_evidence_bundle.py' -v

      - name: Test C5 manifest
        run: python -m unittest discover -s tests -p 'test_c5_manifest.py' -v

      - name: Validate project state, durable evidence and bilingual obligations
        run: |
          python tools/evidence/verify_bundle.py evidence/c5/2026-08-07/manifest.json
          python tools/evidence/verify_bundle.py evidence/c5/2026-08-08-adr0023/manifest.json
          python tools/ai_context/validate_project_state.py --repo .
          python tools/ai_context/validate_reconciliation.py --repo .
          python tools/profiles/validate_c5_manifest.py
          python tools/ai_context/validate_context.py --repo .
          python tools/docs/validate_bilingual_parity.py --repo .
