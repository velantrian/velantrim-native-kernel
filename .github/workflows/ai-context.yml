name: AI context integrity

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "README.md"
      - "README.ru.md"
      - "STATUS.md"
      - "ROADMAP.md"
      - "project-state.json"
      - ".github/copilot-instructions.md"
      - ".github/pull_request_template.md"
      - ".github/workflows/ai-context.yml"
      - "contracts/project-state-v1.schema.json"
      - "contracts/project-state-v2.schema.json"
      - "contracts/registry.json"
      - "contracts/evidence-bundle-v1.schema.json"
      - "docs/**"
      - "evidence/**"
      - "profiles/README.md"
      - "profiles/operational-validation-v0/c5-manifest.json"
      - "tools/ai_context/**"
      - "tools/docs/**"
      - "tools/evidence/**"
      - "tools/profiles/validate_c5_manifest.py"
      - "tests/test_a4_semantic_laws.py"
      - "tests/test_a5_identity_time_change.py"
      - "tests/test_a6_knowledge_lifecycle.py"
      - "tests/test_a7_conflict_uncertainty_revision.py"
      - "tests/test_ai_context_validator.py"
      - "tests/test_architecture_freeze.py"
      - "tests/test_bilingual_parity_validator.py"
      - "tests/test_project_state.py"
      - "tests/test_reconciliation_state.py"
      - "tests/test_evidence_bundle.py"
      - "tests/test_c5_manifest.py"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "README.md"
      - "README.ru.md"
      - "STATUS.md"
      - "ROADMAP.md"
      - "project-state.json"
      - ".github/copilot-instructions.md"
      - ".github/pull_request_template.md"
      - ".github/workflows/ai-context.yml"
      - "contracts/project-state-v1.schema.json"
      - "contracts/project-state-v2.schema.json"
      - "contracts/registry.json"
      - "contracts/evidence-bundle-v1.schema.json"
      - "docs/**"
      - "evidence/**"
      - "profiles/README.md"
      - "profiles/operational-validation-v0/c5-manifest.json"
      - "tools/ai_context/**"
      - "tools/docs/**"
      - "tools/evidence/**"
      - "tools/profiles/validate_c5_manifest.py"
      - "tests/test_a4_semantic_laws.py"
      - "tests/test_a5_identity_time_change.py"
      - "tests/test_a6_knowledge_lifecycle.py"
      - "tests/test_a7_conflict_uncertainty_revision.py"
      - "tests/test_ai_context_validator.py"
      - "tests/test_architecture_freeze.py"
      - "tests/test_bilingual_parity_validator.py"
      - "tests/test_project_state.py"
      - "tests/test_reconciliation_state.py"
      - "tests/test_evidence_bundle.py"
      - "tests/test_c5_manifest.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out exact commit with complete history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile continuity, evidence and documentation tooling
        run: |
          python -m compileall -q \
            tools/ai_context \
            tools/docs \
            tools/evidence \
            tools/profiles/validate_c5_manifest.py \
            tests/test_a4_semantic_laws.py \
            tests/test_a5_identity_time_change.py \
            tests/test_a6_knowledge_lifecycle.py \
            tests/test_a7_conflict_uncertainty_revision.py \
            tests/test_ai_context_validator.py \
            tests/test_architecture_freeze.py \
            tests/test_bilingual_parity_validator.py \
            tests/test_project_state.py \
            tests/test_reconciliation_state.py \
            tests/test_evidence_bundle.py \
            tests/test_c5_manifest.py

      - name: Run continuity, evidence and documentation unit tests
        run: |
          python -m unittest discover -s tests -p 'test_a4_semantic_laws.py' -v
          python -m unittest discover -s tests -p 'test_a5_identity_time_change.py' -v
          python -m unittest discover -s tests -p 'test_a6_knowledge_lifecycle.py' -v
          python -m unittest discover -s tests -p 'test_a7_conflict_uncertainty_revision.py' -v
          python -m unittest discover -s tests -p 'test_ai_context_validator.py' -v
          python -m unittest discover -s tests -p 'test_architecture_freeze.py' -v
          python -m unittest discover -s tests -p 'test_bilingual_parity_validator.py' -v
          python -m unittest discover -s tests -p 'test_project_state.py' -v
          python -m unittest discover -s tests -p 'test_reconciliation_state.py' -v
          python -m unittest discover -s tests -p 'test_evidence_bundle.py' -v
          python -m unittest discover -s tests -p 'test_c5_manifest.py' -v

      - name: Verify historical C5 evidence bundle
        run: python tools/evidence/verify_bundle.py evidence/c5/2026-08-07/manifest.json

      - name: Verify ADR-0023 C5 evidence bundle
        run: python tools/evidence/verify_bundle.py evidence/c5/2026-08-08-adr0023/manifest.json

      - name: Validate project state
        run: python tools/ai_context/validate_project_state.py --repo .

      - name: Validate ADR-0025 architecture freeze
        run: python tools/ai_context/validate_architecture_freeze.py --repo .

      - name: Validate reconciliation state
        run: python tools/ai_context/validate_reconciliation.py --repo .

      - name: Validate C5 profile manifest
        run: python tools/profiles/validate_c5_manifest.py

      - name: Validate AI context
        run: python tools/ai_context/validate_context.py --repo .

      - name: Validate bilingual documentation parity
        run: python tools/docs/validate_bilingual_parity.py --repo .