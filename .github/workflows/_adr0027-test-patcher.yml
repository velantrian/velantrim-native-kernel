name: One-shot ADR-0027 test patch
on:
  push:
    branches: [agent/post-d8-operator-decision-truth]
permissions:
  contents: write
jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'chore(test): apply ADR-0027 current assertions' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/post-d8-operator-decision-truth
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/ai_context/_advance_adr0027_tests.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_a9_reference_laboratory_boundary.py tests/test_a10_open_questions_falsification.py tests/test_integrated_a1_a10_review.py tests/test_independent_architecture_review_protocol.py tests/test_project_state.py
          git commit -m 'test(state): advance current assertions through ADR-0027'
          git push origin HEAD:agent/post-d8-operator-decision-truth
