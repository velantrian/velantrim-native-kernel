name: BPV1 subject falsification instrument

on:
  pull_request:
    paths:
      - ".github/workflows/bpv1.yml"
      - "experiments/bpv1/BPV1-001/subject/**"
      - "experiments/bpv1/BPV1-001/results/**"
      - "experiments/bpv1/BPV1-001/rust-toolchain.toml"
      - "experiments/bpv1/BPV1-001/admission/**"
      - "tools/bpv1/**"
      - "tests/test_bpv1_subject.py"
      - "project-state.json"
      - "STATUS.md"
      - "README.md"
      - "ROADMAP.md"
      - "AGENTS.md"
      - "docs/ai/**"
      - "docs/research/BPV1_D5_R1_QUALIFICATION.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/bpv1.yml"
      - "experiments/bpv1/BPV1-001/subject/**"
      - "experiments/bpv1/BPV1-001/results/**"
      - "experiments/bpv1/BPV1-001/rust-toolchain.toml"
      - "experiments/bpv1/BPV1-001/admission/**"
      - "tools/bpv1/**"
      - "tests/test_bpv1_subject.py"
      - "project-state.json"
      - "STATUS.md"
      - "README.md"
      - "ROADMAP.md"
      - "AGENTS.md"
      - "docs/ai/**"
      - "docs/research/BPV1_D5_R1_QUALIFICATION.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  subject:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out exact commit with complete history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned Rust toolchain (1.97.1)
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Audit bounded D5-R1 scope
        run: python tools/bpv1/audit_scope.py --repo . --mode qualification --base a191e9c868c14af34a269dcdfae44406f1013bda --head HEAD

      - name: Prove frozen BPV1 authorities were not edited
        run: |
          git diff --exit-code a191e9c868c14af34a269dcdfae44406f1013bda...HEAD -- \
            docs/research/BPV1_PREREGISTRATION.json \
            docs/research/BPV1_PREREGISTRATION.md \
            docs/research/BPV1_PREREGISTRATION.ru.md \
            experiments/bpv1/BPV1-001/admission \
            tools/bpv1/evaluate.py

      - name: Validate exact preregistered plan digest
        run: |
          test "$(python tools/bpv1/plan_digest.py --repo .)" = "7fe8174c604678c6b79d3fdeae83d7c5ab0d2fb15bfe343d41659d05d9496ad0"

      - name: Build subject with pinned toolchain
        working-directory: experiments/bpv1/BPV1-001/subject
        run: rustup run 1.97.1 cargo build --release --locked

      - name: Run Rust integrity and boundedness tests
        working-directory: experiments/bpv1/BPV1-001/subject
        run: rustup run 1.97.1 cargo test --release --locked

      - name: Run subject to raw facts
        run: |
          experiments/bpv1/BPV1-001/subject/target/release/bpv1-001-subject --output /tmp/bpv1-d5-r1-raw.json

      - name: Qualify observations outside the subject
        run: |
          python tools/bpv1/qualify_observations.py /tmp/bpv1-d5-r1-raw.json \
            --repo . \
            --output /tmp/bpv1-d5-r1-observations.json \
            --qualification-report /tmp/bpv1-d5-r1-qualification.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/bpv1-d5-r1-qualification.json'))
          assert report['status'] == 'QUALIFIED', report
          assert report['oracle_fixture_expectations_read'] is False
          assert report['implementation_private_runtime_state_read'] is False
          assert report['subject_self_report_used_for_structural_oracle_fields'] is False
          PY

      - name: Evaluate qualified observations against frozen oracle
        run: |
          python tools/bpv1/evaluate.py /tmp/bpv1-d5-r1-observations.json \
            --spec experiments/bpv1/BPV1-001/admission/fixtures.json \
            --output /tmp/bpv1-d5-r1-evaluation.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/bpv1-d5-r1-evaluation.json'))
          allowed = {'SUPPORTED_FOR_SCOPE', 'WEAKENED', 'REFUTED', 'INDETERMINATE', 'NOT_TESTED'}
          assert report['outcome'] in allowed, report['outcome']
          print('BPV1-D5-R1 outcome:', report['outcome'])
          PY

      - name: Emit D5-R1 evidence to job log
        run: |
          echo '=== BPV1_D5_R1_RAW_BEGIN ==='
          cat /tmp/bpv1-d5-r1-raw.json
          echo '=== BPV1_D5_R1_RAW_END ==='
          echo '=== BPV1_D5_R1_QUALIFICATION_BEGIN ==='
          cat /tmp/bpv1-d5-r1-qualification.json
          echo '=== BPV1_D5_R1_QUALIFICATION_END ==='
          echo '=== BPV1_D5_R1_OBSERVATIONS_BEGIN ==='
          cat /tmp/bpv1-d5-r1-observations.json
          echo '=== BPV1_D5_R1_OBSERVATIONS_END ==='
          echo '=== BPV1_D5_R1_EVALUATION_BEGIN ==='
          cat /tmp/bpv1-d5-r1-evaluation.json
          echo '=== BPV1_D5_R1_EVALUATION_END ==='

      - name: Compile subject qualification tests
        run: python -m compileall -q tests/test_bpv1_subject.py tools/bpv1/qualify_observations.py

      - name: Run subject qualification tests
        run: python -m unittest discover -s tests -p 'test_bpv1_subject.py' -v
